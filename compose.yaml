# Ilham — containerised PostgreSQL, and optionally the ETL too.
# Works with `podman compose` and `docker compose` unchanged. Needs no bash on
# the host at all — this is the path that works from a native Windows shell.
#
#   podman compose up -d db          start the database (loads on first run:
#                                     restores db/ilham.dump if committed, else
#                                     schema-only DDL + the smoke test)
#   podman compose logs db           watch the restore or the DDL + smoke test
#   podman compose down              stop, keep the data
#   podman compose down -v           stop and WIPE — next `up` reloads from scratch
#
# Use `down`, not `stop`/`start`. podman-compose runs services in a POD, and the
# published port lives on the pod's infra container, not on ilham-pg. Restarting
# the container while an older pod lingers gives you a container that reports
# `5432/tcp -> 127.0.0.1:5432` and is nonetheless unreachable, because the pod
# it rejoined never had the mapping. `down` removes the pod; `up` recreates it
# with the ports. (docker has no pods and is unaffected.)
#
# The ETL runs on the host by default (fast iteration, your own node). If you do
# not want node installed at all, use the etl profile:
#
#   podman compose --profile tools run --rm etl npm run doctor
#
# ON PODMAN: `podman compose` shells out to the Docker Compose binary, which
# speaks the Docker API and needs the podman socket:
#
#   systemctl --user enable --now podman.socket
#
# `podman-compose` (the python one) talks to podman directly and needs no
# socket. Either works with this file; if `podman compose` reports it cannot
# reach podman.sock, that is which one you are hitting.
#
# The db/*.sql files must be world-READABLE. The init scripts run as the
# postgres user (uid 70) inside the container, while a rootless bind mount
# presents host-owned files as root-owned — so mode 0600 gives
# "psql: /db/00_init.sql: Permission denied". Git does not track read bits, so
# a fresh clone is fine; a 0600 umask locally is not.

services:
  db:
    image: docker.io/library/postgres:16-alpine
    container_name: ilham-pg
    environment:
      POSTGRES_DB: ilham
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ilham
      # UTF8 is not optional: 00_init.sql aborts on anything else, and the
      # corpus is canonically Arabic. C.UTF-8 keeps collation deterministic
      # across machines, which is what lets the reconciliation numbers
      # reproduce on someone else's laptop.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
      ILHAM_SMOKE_TEST: "1"
    ports:
      # Bound to loopback: this database has no password worth the name and
      # should not be reachable from the network.
      - "127.0.0.1:5432:5432"
    volumes:
      # :z relabels for SELinux (Fedora/RHEL). Harmless elsewhere; without it,
      # rootless podman on an enforcing host cannot read the mount.
      - ./db:/db:ro,z
      - ./db/docker-init.sh:/docker-entrypoint-initdb.d/10-ilham.sh:ro,z
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Names the db explicitly — pg_isready against the default would report
      # ready while the init scripts are still running.
      test: ["CMD-SHELL", "pg_isready -U postgres -d ilham"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  # Optional. Only starts with `--profile tools`, so `up -d` never builds it.
  etl:
    profiles: ["tools"]
    build: ./etl
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db            # service name, not localhost — different netns
      PGPORT: "5432"
      PGDATABASE: ilham
      PGUSER: postgres
      PGPASSWORD: ilham
      ILHAM_BOOKS_DIR: /app/raw
      ILHAM_NARRATORS_FILE: /app/raw/ifta_narrators.json
      ILHAM_MANIFEST_FILE: /app/book_manifest.json
      ILHAM_SQL_DIR: /app/sql
      ILHAM_OUT_DIR: /app/build
    volumes:
      - ./etl:/app:z
      # Keeps the image's node_modules from being shadowed by the host mount —
      # and stops a host-built tree (different libc, different arch) leaking in.
      - /app/node_modules
    working_dir: /app

  api:
    build: ./backend
    container_name: ilham-api
    depends_on:
      db:
        condition: service_healthy
    # The backend's own env files, in order, so this file holds no copy of the
    # API's configuration and no secret at all. A later file wins over an
    # earlier one, and `environment:` below wins over both.
    env_file:
      # Committed, and it carries the disposable local defaults — so a fresh
      # clone runs with no setup, the same bargain as the `ilham` password
      # above. The JWT secret in it is on a reject list in config.ts.
      - path: ./backend/.env.example
        required: false
      # Yours, and gitignored. Copy the example to it and edit. Anything set
      # here replaces the value above, which is how a real secret gets in
      # without ever being committed.
      - path: ./backend/.env
        required: false
    environment:
      # Only what the CONTAINER changes about the values above. backend/.env is
      # written for running the API on the host, where the database is on
      # localhost and the browser is on the Vite port. Neither is true in here.
      PGHOST: db
      PGPORT: "5432"
      PORT: "3000"
      # The browser origin the API accepts credentialed requests from. It must
      # be the address you open in the browser, which is the published port of
      # the `web` service below — NOT the Vite dev port that backend/.env names.
      # These two disagreed, and every login from the containerised frontend was
      # blocked by CORS.
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:${WEB_PORT:-8080}}
      # Accepts the placeholder secret from .env.example, and only here. A
      # deployment that does not copy this line refuses to start on a
      # known-public secret, whatever NODE_ENV says.
      ALLOW_DEV_SECRET: "1"
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"

  web:
    build:
      context: ./frontend
      args:
        # BUILD time, and that is the whole point: Vite replaces
        # import.meta.env.VITE_* while it bundles, so this cannot be an
        # environment variable on the container. There was no way to set it
        # through compose at all before.
        #
        # Empty is right for this image. nginx below proxies /api on one
        # origin, so the app wants the same-origin default; an absolute URL
        # here would send the browser straight at the API and give up the
        # proxy, CORS-free cookies included. Set it only for a static-host
        # build — see frontend/.env.example.
        VITE_API_BASE: ${VITE_API_BASE:-}
    container_name: ilham-web
    depends_on:
      - api
    # The frontend's own env files, in the same order and with the same meaning
    # as the api service above: committed defaults first, then your gitignored
    # overrides. Note the scope, which is not the same as the backend's — only
    # the RUNTIME variables here reach nginx. DEV_API_TARGET belongs to the Vite
    # dev server on the host, and VITE_API_BASE is consumed at build, above.
    env_file:
      - path: ./frontend/.env.example
        required: false
      - path: ./frontend/.env
        required: false
    environment:
      # Where nginx forwards /api, and it stays here rather than in an env file
      # because it names a compose service — the same reason PGHOST does on the
      # api service. nginx resolves `api` inside the compose network; a browser,
      # which is outside it, never uses this value.
      API_UPSTREAM: ${API_UPSTREAM:-http://api:3000}
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  pgdata:
