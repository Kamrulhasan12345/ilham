<!-- n1 -->
<g id="node18" class="node">
<title>n1</title>
<polygon fill="none" stroke="#6e7681" points="510,-543.19 20,-543.19 20,-445.94 510,-445.94 510,-543.19"/>
<polygon fill="none" stroke="#6e7681" points="514,-547.19 16,-547.19 16,-441.94 514,-441.94 514,-547.19"/>
<text xml:space="preserve" text-anchor="start" x="28" y="-529.69" font-family="DejaVu Sans Mono" font-size="10.00" fill="#d8c08a">• Edges are FULLY DETERMINED by paths → storing both invites drift.</text>
<text xml:space="preserve" text-anchor="start" x="28" y="-516.94" font-family="DejaVu Sans Mono" font-size="10.00" fill="#d8c08a">• A narrator&#39;s teachers are per&#45;(hadith, sanad) facts, NOT narrator attributes:</text>
<text xml:space="preserve" text-anchor="start" x="28" y="-504.19" font-family="DejaVu Sans Mono" font-size="10.00" fill="#d8c08a"> &#160;a self&#45;FK teacher_narrator_id cannot model M:N&#45;per&#45;chain.</text>
<text xml:space="preserve" text-anchor="start" x="28" y="-491.44" font-family="DejaVu Sans Mono" font-size="10.00" fill="#d8c08a">• Direction: position runs in propagation order, so</text>
<text xml:space="preserve" text-anchor="start" x="28" y="-478.69" font-family="DejaVu Sans Mono" font-size="10.00" fill="#d8c08a"> &#160;from = teacher (earlier), to = student (later) — matches MIS convention.</text>
<text xml:space="preserve" text-anchor="start" x="28" y="-465.94" font-family="DejaVu Sans Mono" font-size="10.00" fill="#d8c08a">• Global teacher/student network = GROUP BY from_narrator, to_narrator.</text>
<text xml:space="preserve" text-anchor="start" x="28" y="-453.19" font-family="DejaVu Sans Mono" font-size="10.00" fill="#d8c08a">• Upgrade path if hot: MATERIALIZED VIEW + REFRESH after seed.</text>
</g>
<!-- n2 -->
<g id="node19" class="node">
<title>n2</title>
<polygon fill="none" stroke="#6e7681" points="423,-693.82 107,-693.82 107,-597.32 423,-597.32 423,-693.82"/>
<polygon fill="none" stroke="#6e7681" points="427,-697.82 103,-697.82 103,-593.32 427,-593.32 427,-697.82"/>
<text xml:space="preserve" text-anchor="start" x="115" y="-680.32" font-family="DejaVu Sans Mono" font-size="10.00" fill="#ffa198">isnad_links.narrator_id is NULLABLE (0..1):</text>
<text xml:space="preserve" text-anchor="start" x="115" y="-667.57" font-family="DejaVu Sans Mono" font-size="10.00" fill="#ffa198">a chain slot may name someone with no profile row.</text>
<text xml:space="preserve" text-anchor="start" x="115" y="-654.82" font-family="DejaVu Sans Mono" font-size="10.00" fill="#ffa198">Mentions live only in staging.mentions (ETL Pass B</text>
<text xml:space="preserve" text-anchor="start" x="115" y="-642.07" font-family="DejaVu Sans Mono" font-size="10.00" fill="#ffa198">is their sole consumer) and never reach corpus.</text>
<text xml:space="preserve" text-anchor="start" x="115" y="-617.32" font-family="DejaVu Sans Mono" font-size="10.00" fill="#ffa198">The link still exists as a positional fact —</text>
<text xml:space="preserve" text-anchor="start" x="115" y="-604.57" font-family="DejaVu Sans Mono" font-size="10.00" fill="#ffa198">raw_name always carries the chain string.</text>
</g>
