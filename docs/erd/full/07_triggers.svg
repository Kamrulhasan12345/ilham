<text text-anchor="start" x="42" y="-223.68" font-family="DejaVu Sans Mono" font-size="10.00" fill="#7ee787">Both fire INSIDE the caller&#39;s transaction — including</text>
<text text-anchor="start" x="42" y="-212.68" font-family="DejaVu Sans Mono" font-size="10.00" fill="#7ee787">the POST /review&#45;sessions BEGIN/COMMIT/ROLLBACK block.</text>
