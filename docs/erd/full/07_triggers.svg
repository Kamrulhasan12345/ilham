<text text-anchor="start" x="42" y="-268.68" font-family="DejaVu Sans Mono" font-size="10.00" fill="#7ee787">4b &#160;Audit → shadow table captures teacher overrides.</text>
<text text-anchor="start" x="42" y="-257.68" font-family="DejaVu Sans Mono" font-size="10.00" fill="#7ee787"> &#160;&#160;&#160;Actor arrives per&#45;connection from the API:</text>
