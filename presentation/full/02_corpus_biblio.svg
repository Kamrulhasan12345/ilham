<!-- n1 -->
<g id="node27" class="node">
<title>n1</title>
<polygon fill="transparent" stroke="transparent" points="423,-545.5 16,-545.5 16,-460.5 423,-460.5 423,-545.5"/>
<text text-anchor="start" x="24" y="-533.5" font-family="DejaVu Sans Mono" font-size="10.00" fill="#8b949e">• hadith_id is a NATURAL key (Ifta mainId), not generated.</text>
<text text-anchor="start" x="24" y="-522.5" font-family="DejaVu Sans Mono" font-size="10.00" fill="#8b949e">• hadith_num is text: some books use compound numbers.</text>
<text text-anchor="start" x="24" y="-511.5" font-family="DejaVu Sans Mono" font-size="10.00" fill="#8b949e">• chapter_id is NULLABLE — a hadith need not sit under a chapter.</text>
<text text-anchor="start" x="24" y="-500.5" font-family="DejaVu Sans Mono" font-size="10.00" fill="#8b949e">• matn_plain NULL = sanad/matn split not available for that row.</text>
<text text-anchor="start" x="24" y="-489.5" font-family="DejaVu Sans Mono" font-size="10.00" fill="#8b949e">• collections.slug is UNIQUE — the stable external identifier.</text>
<text text-anchor="start" x="24" y="-478.5" font-family="DejaVu Sans Mono" font-size="10.00" fill="#8b949e">• hadith_subjects and hadith_translations are weak entities:</text>
<text text-anchor="start" x="24" y="-467.5" font-family="DejaVu Sans Mono" font-size="10.00" fill="#8b949e"> &#160;each is existence&#45;dependent on its parent hadith.</text>
</g>
