<polygon fill="transparent" stroke="transparent" points="1575.04,-170 1246.04,-170 1246.04,-16 1575.04,-16 1575.04,-170"/>
<text text-anchor="start" x="1254.04" y="-158" font-family="DejaVu Sans Mono" font-size="10.00" fill="#7ee787">Three&#45;way narrator treatment:</text>
<text text-anchor="start" x="1254.04" y="-147" font-family="DejaVu Sans Mono" font-size="10.00" fill="#7ee787"> &#160;graded &#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;→ least(weight_IH, weight_Dh)</text>
<text text-anchor="start" x="1254.04" y="-136" font-family="DejaVu Sans Mono" font-size="10.00" fill="#7ee787"> &#160;ungraded (named) &#160;→ 0.50 &#160;&#160;(ungraded ≠ criticized)</text>
<text text-anchor="start" x="1254.04" y="-125" font-family="DejaVu Sans Mono" font-size="10.00" fill="#7ee787"> &#160;placeholder/NULL &#160;→ 0.15 &#160;&#160;(mubham weakens chain)</text>
<text text-anchor="start" x="1254.04" y="-102" font-family="DejaVu Sans Mono" font-size="10.00" fill="#7ee787">anʿana penalty: transmission_word = &#39;عن&#39; → −0.05</text>
<text text-anchor="start" x="1254.04" y="-91" font-family="DejaVu Sans Mono" font-size="10.00" fill="#7ee787">Compiler position EXCLUDED.</text>
<text text-anchor="start" x="1254.04" y="-68" font-family="DejaVu Sans Mono" font-size="10.00" fill="#7ee787">Per sanad: &#160;weakest link = min(w)</text>
<text text-anchor="start" x="1254.04" y="-57" font-family="DejaVu Sans Mono" font-size="10.00" fill="#7ee787">Per hadith: best sanad wins = max(sanad_strength)</text>
<text text-anchor="start" x="1254.04" y="-34" font-family="DejaVu Sans Mono" font-size="10.00" fill="#7ee787">Aggregation, NOT recursion — positions are stored</text>
<text text-anchor="start" x="1254.04" y="-23" font-family="DejaVu Sans Mono" font-size="10.00" fill="#7ee787">explicitly, so WITH RECURSIVE would be artificial.</text>
</g>
