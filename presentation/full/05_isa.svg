<!-- n1 -->
<g id="node17" class="node">
<title>n1</title>
<polygon fill="transparent" stroke="transparent" points="1682.43,-640 1323.43,-640 1323.43,-510 1682.43,-510 1682.43,-640"/>
<text text-anchor="start" x="1331.43" y="-628" font-family="DejaVu Sans Mono" font-size="10.00" fill="#d8c08a">d = DISJOINT: a user is exactly one subtype.</text>
<text text-anchor="start" x="1331.43" y="-617" font-family="DejaVu Sans Mono" font-size="10.00" fill="#d8c08a">Enforced by:</text>
<text text-anchor="start" x="1331.43" y="-606" font-family="DejaVu Sans Mono" font-size="10.00" fill="#d8c08a"> &#160;CHECK (role IN (&#39;student&#39;,&#39;teacher&#39;,&#39;admin&#39;)) &#160;on users</text>
<text text-anchor="start" x="1331.43" y="-595" font-family="DejaVu Sans Mono" font-size="10.00" fill="#d8c08a"> &#160;CHECK (role = &#39;student&#39;) &#160;on students</text>
<text text-anchor="start" x="1331.43" y="-584" font-family="DejaVu Sans Mono" font-size="10.00" fill="#d8c08a"> &#160;CHECK (role = &#39;teacher&#39;) &#160;on teachers</text>
<text text-anchor="start" x="1331.43" y="-573" font-family="DejaVu Sans Mono" font-size="10.00" fill="#d8c08a"> &#160;CHECK (role = &#39;admin&#39;) &#160;&#160;&#160;on admins</text>
<text text-anchor="start" x="1331.43" y="-550" font-family="DejaVu Sans Mono" font-size="10.00" fill="#d8c08a">Caveat (Postgres INHERITS):</text>
<text text-anchor="start" x="1331.43" y="-539" font-family="DejaVu Sans Mono" font-size="10.00" fill="#d8c08a"> &#160;PK/UNIQUE are NOT inherited across child tables, and</text>
<text text-anchor="start" x="1331.43" y="-528" font-family="DejaVu Sans Mono" font-size="10.00" fill="#d8c08a"> &#160;a FK to app.users will NOT see rows in child tables.</text>
<text text-anchor="start" x="1331.43" y="-517" font-family="DejaVu Sans Mono" font-size="10.00" fill="#d8c08a"> &#160;Hence subtype FKs target the child table directly.</text>
</g>
