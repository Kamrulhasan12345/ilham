<text text-anchor="start" x="884.43" y="-578.5" font-family="DejaVu Sans Mono" font-size="10.00" fill="#7ee787">→ app.users &#160;&#160;&#160;&#160;: study_sets.owner_id, notes.user_id,</text>
<text text-anchor="start" x="884.43" y="-567.5" font-family="DejaVu Sans Mono" font-size="10.00" fill="#7ee787"> &#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;audit_log.changed_by &#160;&#160;(polymorphic — any role)</text>
<text text-anchor="start" x="884.43" y="-544.5" font-family="DejaVu Sans Mono" font-size="10.00" fill="#7ee787">The FK target IS the business rule:</text>
<text text-anchor="start" x="884.43" y="-533.5" font-family="DejaVu Sans Mono" font-size="10.00" fill="#7ee787"> &#160;a teacher cannot be enrolled; a student cannot own a circle.</text>
